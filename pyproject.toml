[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "patchnames"
version = "0.1.0"
description = "Rename, describe and archive photo/video files using EXIF metadata, Claude and eBird"
requires-python = ">=3.8"
dependencies = ["pillow", "numpy"]

[project.optional-dependencies]
# patchdoc finds and compares faces, and stitches panoramas, with OpenCV,
# on this machine
faces = ["opencv-python", "numpy"]

[project.scripts]
patchnames = "patchnames.cli:main"
patchdoc = "patchnames.doc:main"

[tool.setuptools.packages.find]
include = ["patchnames*"]

[tool.setuptools.package-data]
patchnames = ["*.md", "*.json", "gui/*"]
