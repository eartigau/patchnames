[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "patchnames"
version = "0.1.0"
description = "Rename and archive photo/video files using EXIF metadata"
requires-python = ">=3.8"
dependencies = ["pillow"]

[project.scripts]
patchnames = "patchnames.cli:main"

[tool.setuptools.packages.find]
include = ["patchnames*"]
